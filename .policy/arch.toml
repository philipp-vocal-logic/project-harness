[[rules]]
files = ["src/**/*.py"]
forbid = [
    "^\\s*(from|import)\\s+(pytest|tests|tokenize)\\b",
    "^\\s*from\\s+\\.",
]
fix = "Use absolute project_harness imports and keep src free of test or tokenize dependencies."

[[rules]]
files = ["src/project_harness/model.py"]
max_lines = 150
forbid = [
    "^\\s*(from|import)\\s+project_harness\\.(cli|core)\\b",
    "^\\s*(from|import)\\s+(sys|argparse|tomllib|subprocess)\\b",
    "\\bprint\\s*\\(",
]
fix = "Import direction is cli -> core -> model. Keep model.py pure and free of IO, CLI, config loading, and printing."

[[rules]]
files = ["src/project_harness/config.py"]
max_lines = 200
forbid = [
    "^\\s*(from|import)\\s+project_harness\\.(cli|core)\\b",
    "^\\s*(from|import)\\s+(sys|argparse|subprocess)\\b",
    "\\bprint\\s*\\(",
]
fix = "Import direction is cli -> core -> config -> model. Keep config.py limited to parsing and validating workflow.toml."

[[rules]]
files = ["src/project_harness/core.py"]
max_lines = 350
forbid = [
    "^\\s*(from|import)\\s+project_harness\\.cli\\b",
    "^\\s*(from|import)\\s+(sys|argparse)\\b",
    "\\bprint\\s*\\(",
]
fix = "Import direction is cli -> core -> config -> model. Keep CLI parsing and stdout/stderr printing out of core.py."

[[rules]]
files = ["src/project_harness/cli.py"]
max_lines = 90
forbid = [
    "^\\s*(from|import)\\s+(re|tomllib|subprocess|fnmatch)\\b",
]
fix = "Keep cli.py as a thin entrypoint that delegates configuration loading and execution to core.py."

[[rules]]
files = ["tests/**/*.py"]
max_lines = 300
fix = "Keep test modules concise and atomic."
