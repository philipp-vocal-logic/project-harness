[settings]
forbidden_subwords = [
    "data",
    "info",
    "item",
    "obj",
    "object",
    "val",
    "value",
    "temp",
    "temporary",
    "mgr",
    "manager",
    "helper",
    "util",
    "utility",
    "stuff",
    "misc",
]

[replacements]
policy = ["convention", "guideline"]
reason = ["justification", "rationale"]
violation = ["hit", "problem", "issue", "finding"]
load = ["fetch", "retrieve", "obtain"]
check = ["lint", "scan", "analyze", "inspect", "audit"]
parse = ["decode", "extract"]
discover = ["locate", "crawl"]
build = ["construct"]
index = ["idx"]
error = ["err", "exc"]
config = ["cfg"]
command = ["cmd"]
pattern = ["regex"]
symbol = ["sym"]
token = ["tok"]
adjacency = ["adj"]
architecture = ["arch"]
traceability = ["trace"]
relative = ["rel"]
reference = ["ref"]
directory = ["dir"]
repository = ["repo"]
string = ["str"]
number = ["no", "num"]
implementation = ["impl"]
diagnostic = ["diag"]
module = ["mod"]
requirement = ["req"]

[[rules]]
files = ["src/**/*.py"]
kinds = ["module"]
pattern = "^[a-z][a-z0-9_]*$"
fix = "Name source modules in lower_snake_case."

[[rules]]
files = ["tests/**/test_*.py"]
kinds = ["module"]
pattern = "^test_[a-z0-9_]+$"
fix = "Name test modules 'test_<subject>'."

[[rules]]
files = [
    "src/project_harness/architecture.py",
    "src/project_harness/symbol.py",
    "src/project_harness/traceability.py",
]
kinds = ["function"]
visibility = "public"
pattern = "^check_[a-z0-9_]+$"
fix = "Prefix public checker functions with 'check_'."

[[rules]]
files = ["src/project_harness/config.py"]
kinds = ["function"]
visibility = "public"
pattern = "^(parse|load|walk|git)(_[a-z0-9]+)*$"
fix = "Start public config functions with 'parse_', 'load_', 'walk_', or 'git'."

[[rules]]
files = ["src/project_harness/core.py"]
kinds = ["function"]
visibility = "public"
pattern = "^(check|run)_[a-z0-9_]+$"
fix = "Prefix public core functions with 'check_' or 'run_'."

[[rules]]
files = ["tests/**/test_*.py"]
kinds = ["function"]
visibility = "public"
pattern = "^test_[a-z0-9_]+$"
fix = "Prefix public test functions with 'test_' (prefix test helpers with '_')."
