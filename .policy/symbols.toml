[settings]
forbidden_subwords = [
    "data",
    "info",
    "item",
    "obj",
    "object",
    "val",
    "value",
    "temp",
    "temporary",
    "mgr",
    "manager",
    "helper",
    "util",
    "utility",
    "stuff",
    "misc",
]

[replacements]
load = ["fetch", "retrieve", "obtain"]
check = ["lint", "scan", "analyze", "inspect", "audit"]
parse = ["decode", "extract"]
discover = ["locate", "crawl"]
build = ["construct"]
index = ["idx", "pos"]
error = ["err", "exc"]
config = ["cfg"]
command = ["cmd"]
pattern = ["re", "regex"]
symbol = ["sym"]
token = ["tok"]
adjacency = ["adj"]
