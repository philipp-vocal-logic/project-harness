[[rules]]
files = ["src/**/*.py"]
forbid = [
    "^\\s*(from|import)\\s+(pytest|tests|tokenize)\\b",
    "^\\s*from\\s+(\\.|project_harness\\s+import\\b)",
]
fix = "Use 'from project_harness.<module> import ...' and keep src free of test or tokenize dependencies."

[[rules]]
files = ["src/project_harness/model.py"]
max_lines = 300
forbid = [
    "^\\s*(from|import)\\s+project_harness\\.(cli|core|config|architecture|symbol|traceability)\\b",
    "^\\s*(from|import)\\s+(os|sys|argparse|tomllib|subprocess)\\b",
    "\\bprint\\s*\\(",
]
fix = "Import direction is cli -> core -> checkers -> config -> model. Keep model.py pure and free of IO, CLI, config loading, and printing."

[[rules]]
files = ["src/project_harness/config.py"]
max_lines = 300
forbid = [
    "^\\s*(from|import)\\s+project_harness\\.(cli|core|architecture|symbol|traceability)\\b",
    "^\\s*(from|import)\\s+(sys|argparse)\\b",
    "\\bprint\\s*\\(",
]
fix = "Import direction is cli -> core -> checkers -> config -> model. Keep config.py limited to parsing and validating .policy/*.toml files and git-based file discovery."

[[rules]]
files = [
    "src/project_harness/architecture.py",
    "src/project_harness/symbol.py",
    "src/project_harness/traceability.py",
]
max_lines = 320
forbid = [
    "^\\s*(from|import)\\s+project_harness\\.(cli|core)\\b",
    "^\\s*(from|import)\\s+(sys|argparse|subprocess)\\b",
    "\\bprint\\s*\\(",
]
fix = "Import direction is cli -> core -> checkers -> config -> model. Keep checker modules free of CLI, subprocess, and printing."

[[rules]]
files = ["src/project_harness/core.py"]
max_lines = 300
forbid = [
    "^\\s*(from|import)\\s+project_harness\\.cli\\b",
    "^\\s*(from|import)\\s+(sys|argparse)\\b",
    "\\bprint\\s*\\(",
]
fix = "Import direction is cli -> core -> checkers -> config -> model. Keep CLI parsing and stdout/stderr printing out of core.py."

[[rules]]
files = ["src/project_harness/cli.py"]
max_lines = 120
forbid = [
    "^\\s*(from|import)\\s+(re|tomllib|subprocess|fnmatch)\\b",
]
fix = "Keep cli.py as a thin entrypoint that delegates configuration loading and execution to core.py and checker modules."

[[rules]]
files = ["tests/**/*.py"]
max_lines = 300
fix = "Keep test modules concise and atomic."
