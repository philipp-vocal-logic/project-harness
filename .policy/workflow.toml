[workflow]
# `harness check --base <ref>` reads this file and all .policy/*.toml rules from the base branch,
# never from the branch under check. Modifying protected_paths requires a policy/* branch where
# every touching commit contains a "Reason: <why>" line.
protected_paths = [".policy/**", ".github/**", ".githooks/**", "pyproject.toml"]
checks = [
    "uv run ruff check .",
    "uv run ruff format --check .",
    "uv run pytest -q",
]
# Red check: when source_paths change, test_command runs the branch tests against the base source
# and must exit in red_exit_codes (1 = tests failed, 2 = collection error).
# Exempts refactor/* and policy/* branches when every touching commit contains a "Reason: <why>" line.
source_paths = ["src/**"]
test_command = "uv run pytest -q"
red_exit_codes = [1, 2]
