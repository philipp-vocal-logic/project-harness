[settings]
paths = ["src", "tests", "trace", "README.md", ".policy/workflow.toml", ".policy/traceability.toml", ".policy/arch.toml", "pyproject.toml"]
exclude = [
    ".git/",
    ".venv/",
    ".pytest_cache/",
    ".ruff_cache/",
    "__pycache__/",
    "*.egg-info/",
    ".policy/glossary.toml",
    ".policy/symbols.toml",
    "glossary.toml",
    "symbols.toml",
    "uv.lock",
]
similarity_threshold = 0.65

[[terms]]
term = "policy"
definition = "A declarative project rule file stored inside the .policy directory."
forbidden_terms = ["convention", "guideline", "charter"]

[[terms]]
term = "workflow"
definition = "The protected paths, checks, and red check rules defined in .policy/workflow.toml."
forbidden_terms = ["playbook", "runbook", "tier_list"]

[[terms]]
term = "reason"
definition = "A 'Reason: <why>' commit message line that records why an exception was taken."
forbidden_terms = ["justification", "rationale"]

[[terms]]
term = "violation"
definition = "A diagnostic line emitted when a protected path, red check, or command check fails."
forbidden_terms = ["offense", "infringement", "breach"]
