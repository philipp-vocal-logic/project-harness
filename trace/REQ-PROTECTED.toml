id = "REQ-PROTECTED"
title = "Reject protected path and weakened requirement changes at merge time unless on a policy branch with Reason lines"
acceptance = [
    "Reject uncommitted working-tree changes in check_merge with [ERR_DIRTY].",
    "Read .policy/*.toml from the base ref and diff merge-base..HEAD with -z --no-renames so renames and non-ASCII paths are inspected.",
    "Reject changes to workflow.protected_paths or weakened base requirements with [ERR_PROTECTED] unless on a policy/* branch where every touching commit has a 'Reason: <why>' line.",
    "Evaluate a policy/* branch against its own .policy/ rules once its protected .policy/ changes and Reason lines pass.",
    "Compare requirements against base_reference so parallel worktrees must rebase onto new base requirements before passing check_merge.",
]
tests = [
    "tests/test_integration.py::test_approved_policy_branch_is_judged_by_its_own_policies",
    "tests/test_integration.py::test_merge_check_allows_additive_requirements_and_protects_weakening",
    "tests/test_integration.py::test_merge_check_rejects_dirty_tree_and_reports_config_errors",
    "tests/test_integration.py::test_merge_check_rejects_protected_change_using_base_rules",
    "tests/test_integration.py::test_merge_check_sees_renamed_and_non_ascii_protected_paths",
    "tests/test_integration.py::test_parallel_worktrees_require_rebase_onto_updated_base",
    "tests/test_integration.py::test_policy_branch_needs_reason_in_every_protected_commit",
    "tests/test_model.py::test_has_reason",
    "tests/test_model.py::test_matches_glob_and_matches_any",
    "tests/test_model.py::test_matching_paths_returns_sorted_unique_matches",
]
